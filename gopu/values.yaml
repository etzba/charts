# Default values for gopu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: gopu
version: v0.1.0

replicaCount: 1

image:
  repository: ghcr.io/etzba/gopu
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: [{name: "ghcr-secret"}]

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

deploymentAnnotations: 
  etzba.com/image-updater: enabled
  etzba.com/image-updater.exclude: "container-name" 

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# secretDistributions help set namespace secrets with secret-distributor. This is additional CRD that distributes secrets between namespaces.
# to read more about it: https://github.com/etzba/secret-distributor
secretDistributions:
  ghcrDockerConfig:
    name: ghcr-docker-config
    secretName: ghcr-secret