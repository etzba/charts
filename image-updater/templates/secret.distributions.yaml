{{- if .Values.secretDistributions }}
{{- range $_, $d := .Values.secretDistributions }}
---
apiVersion: secdist.etzba.com/v1
kind: Distribution
metadata:
  labels:
    app.kubernetes.io/name: secret-distributor
  name: {{ $d.name }}-distribution
spec:
  secretName: {{ $d.secretName }}
{{- end }}
{{- end }}
