apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ include "image-updater.serviceAccountName" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ include "image-updater.serviceAccountName" . }}-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - "*"
    resources:
      - pods
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - "v1"
    resources:
      - pods
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - "apps"
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - list
      - get
      - update
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ include "image-updater.serviceAccountName" . }}-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "image-updater.serviceAccountName" . }}-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "image-updater.serviceAccountName" . }}
    namespace: {{ .Release.namespace }}
