apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ .Values.serviceAccount.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ .Values.serviceAccount.name }}-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs: ["get","list","watch"]
  - apiGroups:
      - "*"
    resources:
      - pods
    verbs: ["get","list","watch"]
  - apiGroups:
      - "v1"
    resources:
      - pods
    verbs: ["get","list","watch"]
  - apiGroups:
      - "apps"
    resources: []
      - deployments
      - daemonsets
      - statefulsets
    verbs: ["get","list","patch","update","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ .Values.serviceAccount.name }}-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccount.name }}-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
